name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependency
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test CLI entry point
        run: python -m forgepilot --help
